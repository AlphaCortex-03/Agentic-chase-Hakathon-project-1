name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - name: Smoke-check entry point
        run: python -m py_compile app.py agent/incidentx_agent.py agent/tools.py agent/runbook_rag.py utils/log_parser.py utils/report_generator.py
